<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Akalynth — Account</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231f1a13'/%3E%3Cpath d='M16 5l7 11-7 11-7-11z' fill='%23d9b25a'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0c0a07; --panel: #16120c; --panel2: #1c1710; --ink: #efe6d2;
      --ink-soft: #b7a988; --ink-dim: #7a7060; --gold: #d9b25a;
      --gold-dim: #a8883e; --line: #2a2318; --green: #6fbf73; --red: #d97060;
      --radius: 12px; --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: radial-gradient(120% 120% at 50% 0%, #17120b 0%, var(--bg) 60%);
      color: var(--ink); font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: 40px 16px 80px;
    }
    /* brand */
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
    .brand-mark { color: var(--gold); font-size: 24px; line-height: 1; }
    .brand-name { font-size: 20px; font-weight: 700; letter-spacing: .4px; }
    .lane-tag {
      font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700;
      background: var(--gold); color: #1a1408; padding: 2px 9px; border-radius: 999px; margin-left: 6px;
    }
    /* card */
    .card {
      width: 100%; max-width: 480px; background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .card-title { font-size: 17px; font-weight: 700; margin-bottom: 20px; color: var(--ink); }
    /* form */
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 5px; }
    input[type=email], input[type=password], input[type=text], select {
      width: 100%; padding: 11px 13px; background: #0f0d09; border: 1px solid var(--line);
      border-radius: var(--radius-sm); color: var(--ink); font-size: 15px;
      outline: none; transition: border-color .15s;
    }
    input:focus, select:focus { border-color: var(--gold-dim); }
    select option { background: #16120c; }
    /* buttons */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 18px; border-radius: var(--radius-sm); font-weight: 700; font-size: 15px;
      border: none; cursor: pointer; transition: filter .12s, transform .05s; text-decoration: none;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--gold); color: #1a1408; width: 100%; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-primary:disabled { opacity: .45; cursor: default; filter: none; }
    .btn-ghost {
      background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
      font-size: 13px; padding: 8px 14px;
    }
    .btn-ghost:hover { border-color: var(--ink-dim); color: var(--ink); }
    .btn-play {
      background: var(--gold); color: #1a1408; padding: 9px 18px;
      font-size: 14px; border-radius: var(--radius-sm); white-space: nowrap;
    }
    .btn-play:hover { filter: brightness(1.08); }
    .btn-play:disabled { opacity: .45; cursor: default; filter: none; }
    /* character rows */
    .char-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .char-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 14px 16px;
    }
    .char-info { flex: 1; min-width: 0; }
    .char-name { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
    .char-meta { font-size: 12px; color: var(--ink-dim); }
    /* notice / error */
    .notice {
      padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px;
      border: 1px solid;
    }
    .notice-error { background: rgba(217,112,96,.12); border-color: rgba(217,112,96,.3); color: #f0a090; }
    .notice-info  { background: rgba(217,178,90,.08); border-color: rgba(217,178,90,.2); color: var(--ink-soft); }
    .notice-ok    { background: rgba(111,191,115,.1);  border-color: rgba(111,191,115,.3); color: #9ae09e; }
    /* divider */
    .divider { border: none; border-top: 1px solid var(--line); margin: 20px 0; }
    .section-label { font-size: 12px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 12px; }
    /* footer */
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    footer { margin-top: 28px; font-size: 12px; color: var(--ink-dim); text-align: center; }
    footer a { color: var(--ink-soft); }
    /* spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(217,178,90,.3);
      border-top-color: var(--gold); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0;
    }
    .spinner-sm { width: 14px; height: 14px; }
    /* views */
    .view { display: none; }
    .view.active { display: block; }
    #view-loading { text-align: center; padding: 60px 0; }
    #view-loading .spinner { width: 32px; height: 32px; border-width: 3px; margin: 0 auto 16px; }
    #view-loading p { color: var(--ink-dim); font-size: 14px; }
    /* inline create form */
    #create-form { margin-top: 18px; background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 18px; }
    #create-form .card-title { font-size: 14px; margin-bottom: 14px; }
    .row-tight { display: flex; gap: 10px; }
    .row-tight .field { flex: 1; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">◆</span>
    <span class="brand-name">Akalynth</span>
    <span class="lane-tag">Beta</span>
  </div>

  <!-- Loading -->
  <div id="view-loading" class="view active">
    <div class="spinner"></div>
    <p>Checking session…</p>
  </div>

  <!-- Login -->
  <div id="view-login" class="view">
    <div class="card">
      <p class="card-title">Sign in</p>
      <div id="login-error" class="notice notice-error" style="display:none"></div>
      <div id="login-notice" class="notice" style="display:none"></div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button id="login-btn" class="btn btn-primary">Sign in</button>
      <hr class="divider" />
      <div class="row" style="justify-content:space-between">
        <a class="btn btn-ghost" href="/forgot.html">Forgot password</a>
        <a class="btn btn-ghost" href="/register.html">Create account</a>
      </div>
    </div>
  </div>

  <!-- Characters -->
  <div id="view-characters" class="view">
    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom:20px">
        <p class="card-title" style="margin:0">Your characters</p>
        <button id="sign-out-btn" class="btn btn-ghost" style="padding:7px 13px;font-size:12px">Sign out</button>
      </div>

      <div id="char-notice" class="notice notice-info" style="display:none"></div>
      <div id="beta-status" class="notice notice-info" style="display:none"></div>
      <div id="char-list" class="char-list"></div>

      <button id="add-char-btn" class="btn btn-ghost" style="width:100%">+ New character</button>

      <div id="create-form" style="display:none">
        <p class="card-title">New character</p>
        <div id="create-error" class="notice notice-error" style="display:none"></div>
        <div class="field">
          <label for="char-name">Name</label>
          <input id="char-name" type="text" maxlength="24" placeholder="Your character's name" />
        </div>
        <div class="row-tight">
          <div class="field">
            <label for="char-sex">Sex</label>
            <select id="char-sex"><option value="male">Male</option><option value="female">Female</option></select>
          </div>
          <div class="field">
            <label for="char-outfit">Outfit</label>
            <select id="char-outfit"></select>
          </div>
        </div>
        <div class="row" style="margin-top:14px; justify-content:flex-end; gap:8px">
          <button id="cancel-create-btn" class="btn btn-ghost">Cancel</button>
          <button id="confirm-create-btn" class="btn btn-play">Create &amp; Play</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Email not verified -->
  <div id="view-unverified" class="view">
    <div class="card">
      <p class="card-title">Verify your email</p>
      <div class="notice notice-info">
        Check your inbox for a verification link before you can play.
      </div>
      <div id="resend-notice" class="notice" style="display:none"></div>
      <div class="row" style="margin-top:16px">
        <button id="resend-btn" class="btn btn-primary" style="flex:1">Resend verification email</button>
        <button id="unverified-sign-out" class="btn btn-ghost">Sign out</button>
      </div>
    </div>
  </div>

  <footer>
    <a href="/">beta.akalynth.com</a> &nbsp;·&nbsp; <a href="https://beta-api.akalynth.com/v1/health">server status</a>
  </footer>

<script>
const API = 'https://beta-api.akalynth.com';
const IDENTITY_KEY = 'akalynth.identity.v1';
const PLAY_PATH = '/play/';
const DEFAULT_PLAY_TOKEN_TTL_MS = 15 * 60 * 1000;
let sessionCsrfToken = '';

// ── helpers ─────────────────────────────────────────────────────────────────

function getCsrf() {
  const m = document.cookie.match(/(?:^|;\s*)akalynth_csrf=([^;]*)/);
  return m ? decodeURIComponent(m[1]) : sessionCsrfToken;
}

async function api(method, path, body) {
  const opts = {
    method,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', 'x-csrf-token': getCsrf() },
  };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const json = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data: json };
}

function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = msg ? '' : 'none';
}

function setNotice(id, msg, kind) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = `notice notice-${kind}`;
  el.style.display = msg ? '' : 'none';
}

function setBtn(id, loading, label) {
  const btn = document.getElementById(id);
  btn.disabled = loading;
  btn.innerHTML = loading
    ? '<span class="spinner spinner-sm"></span>'
    : label;
}

function identityFromPlayResponse(data) {
  const expiresAt = typeof data.expires_at === 'number'
    ? data.expires_at
    : Date.now() + DEFAULT_PLAY_TOKEN_TTL_MS;
  return { playerId: data.character?.character_id, name: data.character?.name, token: data.token, expiresAt };
}

// ── outfit catalog ───────────────────────────────────────────────────────────

let outfitsBySex = {};

async function loadOutfits(sex) {
  const cached = outfitsBySex[sex];
  if (cached) return cached;
  const { ok, data } = await api('GET', `/v1/outfits?sex=${sex}`);
  if (!ok) return [];
  outfitsBySex[sex] = data.outfits ?? [];
  return outfitsBySex[sex];
}

async function refreshOutfitSelect() {
  const sex = document.getElementById('char-sex').value;
  const outfits = await loadOutfits(sex);
  const sel = document.getElementById('char-outfit');
  sel.innerHTML = outfits.map(o => `<option value="${o.outfit_id}">${escHtml(o.name ?? o.outfit_id)}</option>`).join('');
}

// ── character list ───────────────────────────────────────────────────────────

function outfitLabel(outfitId) {
  if (!outfitId) return 'Unknown outfit';
  for (const list of Object.values(outfitsBySex)) {
    const found = list.find(o => o.outfit_id === outfitId);
    if (found) return found.name ?? String(outfitId).replace(/_/g, ' ');
  }
  return String(outfitId).replace(/_/g, ' ');
}

async function renderCharacters() {
  const { ok, data } = await api('GET', '/v1/characters');
  const list = document.getElementById('char-list');
  const notice = document.getElementById('char-notice');
  if (!ok) { notice.textContent = 'Could not load characters.'; notice.style.display = ''; return; }
  notice.style.display = 'none';

  const chars = data.characters ?? [];
  if (chars.length === 0) {
    list.innerHTML = '<p style="color:var(--ink-dim);font-size:14px;padding:8px 0">No characters yet — create one below.</p>';
    return;
  }
  list.innerHTML = chars.map(c => `
    <div class="char-row" data-id="${c.character_id}">
      <div class="char-info">
        <div class="char-name">${escHtml(c.name)}</div>
        <div class="char-meta">${escHtml(outfitLabel(c.outfit_id))} &middot; ${escHtml(c.world_id.replace(/_/g,' '))}</div>
      </div>
      <button class="btn btn-play play-btn" data-id="${c.character_id}">▶ Play</button>
    </div>
  `).join('');

  list.querySelectorAll('.play-btn').forEach(btn => {
    btn.addEventListener('click', () => playCharacter(btn.dataset.id, btn));
  });
}

async function renderBetaStatus() {
  const notice = document.getElementById('beta-status');
  try {
    const { ok, data } = await api('GET', '/v1/beta/me');
    if (!ok || !data?.cohort) {
      notice.style.display = 'none';
      return;
    }
    const cohort = data.cohort;
    notice.textContent = `Controlled beta · ${cohort.cohort_id} · release ${String(cohort.release_commit).slice(0, 12)}`;
    notice.className = 'notice notice-ok';
    notice.style.display = '';
  } catch {
    notice.style.display = 'none';
  }
}

async function playCharacter(characterId, btnEl) {
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '…'; }
  const { ok, data } = await api('POST', '/v1/characters/select', { character_id: characterId });
  if (!ok) {
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = '▶ Play'; }
    const notice = document.getElementById('char-notice');
    notice.textContent = data?.error ?? 'Could not start session. Try again.';
    notice.className = 'notice notice-error';
    notice.style.display = '';
    return;
  }
  // Save token so the game client auto-connects as this character
  localStorage.setItem(IDENTITY_KEY, JSON.stringify(identityFromPlayResponse(data)));
  window.location.href = PLAY_PATH;
}

// ── create character ─────────────────────────────────────────────────────────

async function createAndPlay() {
  const name = document.getElementById('char-name').value.trim();
  const sex  = document.getElementById('char-sex').value;
  const outfit_id = document.getElementById('char-outfit').value;
  setError('create-error', '');
  if (!name) { setError('create-error', 'Enter a name.'); return; }

  setBtn('confirm-create-btn', true);
  const { ok, data } = await api('POST', '/v1/characters', { name, sex, outfit_id, world_id: 'rookguard' });
  setBtn('confirm-create-btn', false, 'Create &amp; Play');
  if (!ok) { setError('create-error', data?.error ?? 'Could not create character.'); return; }

  localStorage.setItem(IDENTITY_KEY, JSON.stringify(identityFromPlayResponse(data)));
  window.location.href = PLAY_PATH;
}

// ── auth ─────────────────────────────────────────────────────────────────────

async function signOut() {
  await api('POST', '/v1/accounts/logout');
  sessionCsrfToken = '';
  localStorage.removeItem(IDENTITY_KEY);
  show('view-login');
}

async function resendVerification() {
  setBtn('resend-btn', true);
  const { ok, data } = await api('POST', '/v1/accounts/verify/resend');
  setBtn('resend-btn', false, 'Resend verification email');
  const n = document.getElementById('resend-notice');
  if (ok) {
    n.className = 'notice notice-ok'; n.textContent = data?.message ?? 'Verification email sent.';
  } else {
    n.className = 'notice notice-error'; n.textContent = data?.message ?? 'Could not send — try again later.';
  }
  n.style.display = '';
}

// ── boot ─────────────────────────────────────────────────────────────────────

async function handleQueryAction() {
  const params = new URLSearchParams(window.location.search);
  const fragment = new URLSearchParams(window.location.hash.slice(1));
  const reset = fragment.get('reset');
  if (reset) {
    window.history.replaceState({}, document.title, window.location.pathname);
    window.location.replace(`/forgot.html#reset=${encodeURIComponent(reset)}`);
    return { redirected: true };
  }

  const verify = params.get('verify');
  if (!verify) return null;
  const { ok, data } = await api('POST', '/v1/accounts/verify-email', { token: verify });
  window.history.replaceState({}, document.title, window.location.pathname);
  return {
    kind: ok ? 'ok' : 'error',
    message: ok ? 'Email verified. Sign in to continue.' : (data?.error ?? 'Verification link is invalid or expired.'),
  };
}

async function boot() {
  show('view-loading');
  // Pre-load outfits for both sexes in background
  loadOutfits('male');
  loadOutfits('female');

  const queryNotice = await handleQueryAction();
  if (queryNotice?.redirected) return;

  const { ok, data } = await api('GET', '/v1/accounts/me');
  if (!ok || !data.account) {
    show('view-login');
    if (queryNotice) setNotice('login-notice', queryNotice.message, queryNotice.kind);
    return;
  }
  if (!data.account.email_verified) { show('view-unverified'); return; }

  if (typeof data.csrf_token === 'string' && data.csrf_token) sessionCsrfToken = data.csrf_token;

  show('view-characters');
  await renderCharacters();
  void renderBetaStatus();
}

// ── util ─────────────────────────────────────────────────────────────────────

function escHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── wire events ──────────────────────────────────────────────────────────────

document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  setError('login-error', '');
  if (!email || !password) { setError('login-error', 'Enter email and password.'); return; }
  setBtn('login-btn', true);
  const { ok, data } = await api('POST', '/v1/accounts/login', { email, password });
  setBtn('login-btn', false, 'Sign in');
  if (!ok) { setError('login-error', data?.error ?? 'Login failed.'); return; }
  if (typeof data.csrf_token === 'string' && data.csrf_token) sessionCsrfToken = data.csrf_token;
  await boot();
});

document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('login-btn').click(); });

document.getElementById('sign-out-btn').addEventListener('click', signOut);
document.getElementById('unverified-sign-out').addEventListener('click', signOut);
document.getElementById('resend-btn').addEventListener('click', resendVerification);

document.getElementById('add-char-btn').addEventListener('click', async () => {
  const form = document.getElementById('create-form');
  const isOpen = form.style.display !== 'none';
  form.style.display = isOpen ? 'none' : '';
  if (!isOpen) {
    await refreshOutfitSelect();
    document.getElementById('char-name').focus();
  }
});

document.getElementById('cancel-create-btn').addEventListener('click', () => {
  document.getElementById('create-form').style.display = 'none';
  setError('create-error', '');
});

document.getElementById('char-sex').addEventListener('change', refreshOutfitSelect);
document.getElementById('confirm-create-btn').addEventListener('click', createAndPlay);

// kick off
boot();
</script>
</body>
</html>
