# Beta API sits behind Caddy on loopback. Without TRUST_PROXY, every WebSocket
# upgrade appears as 127.0.0.1 and all players share one IP rate-limit bucket
# (connect/move/chat), causing constant 429 "Too Many Requests".
[Service]
Environment=TRUST_PROXY=1
Environment=TRUST_PROXY_LOOPBACK_ONLY=1
# Per-real-IP limits (mobile reconnects + held D-pad exceed prod defaults).
Environment=IP_CONNECTION_LIMIT=30
Environment=IP_MOVE_RATE_LIMIT=12