# Crash-loop guard for the beta lane (audit 2026-06-05, issue #144).
#
# The beta unit (akalynth-beta.service) uses Restart=always. Without a start
# limit, a startup failure restarts forever — the audit found ~6 server_boot in
# 30s with no intervening server_shutdown (a crash-loop) in the beta receipt
# chain. StartLimit caps repeated *start failures* so systemd stops retrying and
# parks the unit in `failed` instead of hammering. (The prod unit
# infra/systemd/akalynth.service already carries the same StartLimit.)
#
# Graceful shutdown is handled in-process: index.ts traps SIGINT/SIGTERM and
# writes exactly one server_shutdown receipt before exit, so a normal
# `systemctl stop` always pairs boot->shutdown. A crash cannot emit a shutdown
# by definition; this guard bounds how hard a crash-loop runs.
#
# Install as a drop-in (does NOT restart the running service):
#   sudo install -D -m644 infra/systemd/akalynth-beta.service.d/10-crashloop-guard.conf \
#     /etc/systemd/system/akalynth-beta.service.d/10-crashloop-guard.conf
#   sudo systemctl daemon-reload
#   systemctl show akalynth-beta.service -p StartLimitBurst -p StartLimitIntervalUSec
#
# StartLimit* must live in [Unit].
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=5
