# Hardening for the beta lane (audit 2026-06-05, issue #147).
# Brings akalynth-beta.service up to the infra/systemd/akalynth.service sandbox
# via a drop-in (the beta unit is hand-managed, not templated from the repo).
# MemoryDenyWriteExecute stays FALSE: Node's V8 JIT needs writable+executable
# memory and crashes under MDWX=true. ReadWritePaths is left to the base unit.
#
# Verified on ops-dev-01 (beta): systemd-analyze security 8.4 EXPOSED -> 1.4 OK,
# service active, /v1/health 200, WS 101, guest-session sqlite write all green.
#
# Install (does restart the service, so run in a maintenance window):
#   sudo install -D -m644 infra/systemd/akalynth-beta.service.d/20-hardening.conf \
#     /etc/systemd/system/akalynth-beta.service.d/20-hardening.conf
#   sudo systemctl daemon-reload && sudo systemctl restart akalynth-beta.service
#   systemd-analyze security akalynth-beta.service
[Service]
# Loopback :3000 is unprivileged -> the service needs no capabilities.
CapabilityBoundingSet=
AmbientCapabilities=
# TCP (INET/INET6) + AF_UNIX + AF_NETLINK (Node uses netlink for iface/DNS info).
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
# Curated service syscall allowlist minus privileged/resource-control families.
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
SystemCallFilter=~@resources
SystemCallErrorNumber=EPERM
SystemCallArchitectures=native
NoNewPrivileges=true
PrivateDevices=true
ProtectClock=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectControlGroups=true
ProtectProc=invisible
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
RemoveIPC=true
MemoryDenyWriteExecute=false
UMask=0077
