# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Akalynth uses Codex-only review/deploy lanes. Keep CodeRabbit installed state out
# of repo policy by disabling automatic review, chat, retention, and generators here.

reviews:
  high_level_summary: false
  review_status: false
  review_details: false
  commit_status: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_labels: false
  suggested_reviewers: false
  enable_prompt_for_ai_agents: false
  auto_review:
    enabled: false
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 0
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false

chat:
  art: false
  auto_reply: false
  integrations:
    jira:
      usage: "disabled"
    linear:
      usage: "disabled"

knowledge_base:
  opt_out: true
  web_search:
    enabled: false
  code_guidelines:
    enabled: false
  jira:
    usage: "disabled"
  linear:
    usage: "disabled"
  mcp:
    usage: "disabled"
