name: Verification Spine

# Archived project: the nightly schedule trigger was removed 2026-08-20 so the
# repository carries no recurring automation. Push/PR/dispatch triggers remain
# functional if self-hosted runners are ever reattached.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/lib/android-sdk
  ANDROID_SDK_ROOT: /usr/lib/android-sdk

jobs:
  verify:
    runs-on: [self-hosted, ubuntu-24.04]
    timeout-minutes: 30

    steps:
      - name: PR compatibility summary
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## Verification Spine"
            echo ""
            echo "Deep verification runs on push to main or manual dispatch."
            echo "Pull requests are gated by CI / PR merge gate (fast)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build verification spine
        if: github.event_name != 'pull_request'
        run: |
          cd packages/verification-spine
          npm run build

      - name: Run verification spine
        if: github.event_name != 'pull_request'
        id: verify
        run: |
          npm run build:packages
          node packages/verification-spine/bin/akalynth-verify.js \
            --mode ci \
            --profile quick \
            --skip-build \
            --format json \
            --out verify-out

      - name: Verify asset mirror sync
        if: github.event_name != 'pull_request'
        run: npm run verify:asset-sync

      - name: Verify account-character parity
        if: github.event_name != 'pull_request' && github.server_url == 'https://github.com'
        run: npm run verify:account-character

      - name: Verify account-character parity (Gitea subset)
        if: github.event_name != 'pull_request' && github.server_url != 'https://github.com'
        run: |
          bash scripts/verify_protocol_sync.sh
          npm -w apps/server run verify:quick
          npm -w apps/server run test:web-economy
          npm -w apps/debug-client run verify:account-character

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request' && github.server_url == 'https://github.com'
        with:
          name: verification-report
          path: verify-out/
          retention-days: 30

      - name: Generate job summary
        if: always() && github.event_name != 'pull_request'
        run: |
          node -e "
          const fs = require('fs');
          const path = 'verify-out/verification-report.json';

          if (!fs.existsSync(path)) {
            console.log('## ⚠️ Verification Spine');
            console.log('');
            console.log('No verification report found. Check logs above.');
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const failed = report.results.filter(x => !x.ok);
          const passed = report.results.filter(x => x.ok);

          // Header
          const icon = report.ok ? '✅' : '❌';
          console.log(\`## \${icon} Verification Spine\`);
          console.log('');

          // Summary
          console.log('**Summary:**');
          console.log(\`- Mode: \${report.mode}\`);
          console.log(\`- Total verifiers: \${report.summary.total}\`);
          console.log(\`- Passed: \${passed.length}\`);
          console.log(\`- Failed: \${failed.length}\`);
          console.log(\`- Duration: \${(report.durationMs / 1000).toFixed(1)}s\`);
          console.log('');

          // Failures (detailed)
          if (failed.length > 0) {
            console.log('### ❌ Failures');
            console.log('');
            for (const f of failed) {
              console.log(\`#### \${f.verifierId}\`);
              console.log('');
              if (f.findings && f.findings.length > 0) {
                const topFindings = f.findings.slice(0, 3);
                for (const finding of topFindings) {
                  console.log(\`- **[\${finding.severity}]** \${finding.message}\`);
                  if (finding.hint) {
                    console.log(\`  - 💡 Fix: \${finding.hint}\`);
                  }
                }
                if (f.findings.length > 3) {
                  console.log(\`- _(+\${f.findings.length - 3} more findings)_\`);
                }
              } else {
                console.log('- Verifier failed (no findings reported)');
              }
              console.log('');
            }

            console.log('### 🔧 Quick Commands');
            console.log('');
            console.log(\`\\\`\\\`\\\`bash\`);
            console.log('# Run locally (all verifiers)');
            console.log('npm run verify');
            console.log('');
            console.log('# Run specific verifier');
            if (failed.length > 0) {
              console.log(\`npm run verify -- --only \${failed[0].verifierId}\`);
            }
            console.log('');
            console.log('# Skip build (faster iteration)');
            console.log('npm run verify -- --skip-build');
            console.log(\`\\\`\\\`\\\`\`);
          }

          // Passed (summary only)
          if (passed.length > 0 && !report.ok) {
            console.log('### ✅ Passed');
            console.log('');
            console.log(\`\${passed.map(x => x.verifierId).join(', ')}\`);
            console.log('');
          }

          // Footer
          console.log('---');
          console.log('');
          console.log('📊 Full report available in artifacts: \`verification-report\`');
          " >> $GITHUB_STEP_SUMMARY

      - name: Fail if verification failed
        if: github.event_name != 'pull_request' && steps.verify.outcome == 'failure'
        run: |
          echo "❌ Verification spine failed. See summary above for details."
          exit 1
