name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      codex_plugin_only: ${{ steps.classify.outputs.codex_plugin_only }}
      full_ci_required: ${{ steps.classify.outputs.full_ci_required }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          codex_plugin_only=false
          full_ci_required=true

          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            full_ci_required=false
            codex_plugin_only=true

            if [ -z "$changed_files" ]; then
              codex_plugin_only=false
              full_ci_required=false
            fi

            while IFS= read -r file; do
              [ -z "$file" ] && continue

              case "$file" in
                .codex/*|.agents/*|plugins/akalynth-studio/*|tools/validate-codex-plugin.mjs|.github/ISSUE_TEMPLATE/*)
                  ;;
                package.json)
                  package_diff="$(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- package.json)"
                  if printf '%s\n' "$package_diff" | grep -E '^[+-][^+-]' | grep -v 'validate:codex-plugin' >/dev/null; then
                    codex_plugin_only=false
                    full_ci_required=true
                  fi
                  ;;
                *)
                  codex_plugin_only=false
                  full_ci_required=true
                  ;;
              esac
            done <<< "$changed_files"
          fi

          {
            echo "codex_plugin_only=$codex_plugin_only"
            echo "full_ci_required=$full_ci_required"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## CI path classification"
            echo ""
            echo "- Event: $EVENT_NAME"
            echo "- Repo metadata fastpath eligible: $codex_plugin_only"
            echo "- Full CI required: $full_ci_required"
            echo ""
            echo "### Changed files"
            echo '```'
            if [ "$EVENT_NAME" = "pull_request" ]; then
              printf '%s\n' "$changed_files"
            else
              echo "push to main: full CI forced"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  repo-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.codex_plugin_only == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Codex/plugin scaffold
        run: npm run validate:codex-plugin

      - name: Validate delegation issue templates
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          const requiredFiles = [
            '.github/ISSUE_TEMPLATE/delegation-task.yml',
            '.github/ISSUE_TEMPLATE/config.yml',
          ];
          const requiredMarkers = [
            'name: Delegation task',
            'title: "[Delegation] "',
            'delegation',
            'state:triage',
            'Scope lane',
            'Preferred skill lane',
            'Allowed files / areas',
            'Forbidden files / actions',
            'Acceptance criteria',
            'Verification commands',
            'Expected branch name',
            'PR linkage requirement',
            'Closure evidence',
            'Dependencies / blockers',
            'Assignee or delegation target',
            'blank_issues_enabled: false',
          ];

          const combined = requiredFiles.map((file) => {
            if (!fs.existsSync(file)) throw new Error(`missing issue template: ${file}`);
            const text = fs.readFileSync(file, 'utf8');
            if (text.trim().length === 0) throw new Error(`empty issue template: ${file}`);
            return text;
          }).join('\n');

          const missing = requiredMarkers.filter((marker) => !combined.includes(marker));
          if (missing.length > 0) {
            throw new Error(`missing issue template markers: ${missing.join(', ')}`);
          }

          console.log('delegation issue templates validated');
          NODE

      - name: Build packages
        run: npm run build:packages

      - name: Build server
        run: npm -w apps/server run build

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.full_ci_required == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: API-first invariant guard
        run: ./scripts/ci_invariant_guard.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/server/package-lock.json

      - name: Docs audit (deterministic)
        run: node tools/doc_audit.js --ci --out artifacts/akalynth-doc-audit.json --summary artifacts/akalynth-doc-audit-summary.md

      - name: Verify protocol docs are in sync
        run: ./scripts/verify_protocol_sync.sh

      - name: Install dependencies
        run: cd apps/server && npm ci

      - name: TypeScript build
        run: cd apps/server && npm run build

      - name: Run MVP verification
        run: ./scripts/verify_mvp.sh

      - name: Chain path discipline check
        run: bash scripts/test-chain-discipline.sh

      - name: Generate deterministic CI Chronicle key
        run: |
          mkdir -p .secrets
          node --input-type=module -e "
            import fs from 'node:fs';
            import crypto from 'node:crypto';
            const seed = crypto.createHash('sha256').update('akalynth-ci-fixture-key-v1').digest();
            fs.writeFileSync('.secrets/chronicle.key', seed.subarray(0, 32));
            fs.chmodSync('.secrets/chronicle.key', 0o600);
            console.log('[ci] wrote .secrets/chronicle.key (32 bytes, mode 0600)');
          "

      - name: Generate CI fixture receipts chain (signed)
        env:
          CHRONICLE_KEY_PATH: ${{ github.workspace }}/.secrets/chronicle.key
          AKALYNTH_RECEIPT_CHAIN_PATH: ${{ github.workspace }}/apps/server/fixtures/ci-receipts/receipts.jsonl
        run: |
          cd apps/server
          npm run fixture:generate

      - name: Generate CI chronicle log fixture
        run: |
          cd apps/server
          node tools/generate-chronicle-log.js fixtures/ci-chronicle/chronicle.log

      - name: Receipt + chronicle hygiene (audit)
        env:
          ENABLE_CHRONICLE: "1"
          CHRONICLE_LOG_PATH: ${{ github.workspace }}/apps/server/fixtures/ci-chronicle/chronicle.log
          AKALYNTH_RECEIPT_CHAIN_PATH: ${{ github.workspace }}/apps/server/fixtures/ci-receipts/receipts.jsonl
        run: npm run verify:receipt-hygiene

      - name: Constitutional verifiers (fixture + unit gates)
        env:
          CHRONICLE_KEY_PATH: ${{ github.workspace }}/.secrets/chronicle.key
          AKALYNTH_RECEIPT_CHAIN_PATH: ${{ github.workspace }}/apps/server/fixtures/ci-receipts/receipts.jsonl
        run: |
          cd apps/server
          npm run verify:lifecycle
          npm run verify:monetization
          npm run verify:work-contracts
          npm run verify:treasury

      - name: Write showcase summary
        if: always()
        run: |
          {
            echo "## Akalynth CI Proof Surface"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Protocol sync: required"
            echo "- MVP verification: required"
            echo "- Receipt/chronicle hygiene: required"
            echo "- Constitutional verifiers: required"
            echo ""
            echo "See uploaded artifact: akalynth-verification-artifacts"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akalynth-verification-artifacts
          path: |
            artifacts/
            apps/server/fixtures/ci-receipts/
            apps/server/fixtures/ci-chronicle/
          retention-days: 14

  loadtest-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [changes, verify]
    if: github.event_name == 'push' || needs.changes.outputs.full_ci_required == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install server dependencies
        run: npm ci

      - name: Build server
        run: npm run build:packages && npm -w apps/server run build

      - name: Install loadtest dependencies
        run: cd tools/loadtest && npm ci

      - name: Start server in background
        run: |
          RUN_DIR="$(mktemp -d)"
          mkdir -p "$RUN_DIR/audit" "$RUN_DIR/data" "$RUN_DIR/secrets"
          touch "$RUN_DIR/audit/receipts.jsonl"
          node --input-type=module -e "
            import fs from 'node:fs';
            import crypto from 'node:crypto';
            const keyPath = process.argv[1];
            const seed = crypto.createHash('sha256').update('akalynth-loadtest-smoke-key-v1').digest();
            fs.writeFileSync(keyPath, seed.subarray(0, 32));
            fs.chmodSync(keyPath, 0o600);
          " "$RUN_DIR/secrets/chronicle.key"
          cd apps/server
          npm run rulebook:genesis
          DEBUG=1 \
          ALLOW_INSECURE_LOCAL=1 \
          AKALYNTH_LIFECYCLE_VERIFY=0 \
          AKALYNTH_RECEIPT_CHAIN_PATH="$RUN_DIR/audit/receipts.jsonl" \
          AKALYNTH_DB_PATH="$RUN_DIR/data/akalynth.db" \
          AKALYNTH_REPLAY_MARKER_PATH="$RUN_DIR/data/replay_marker.json" \
          CHRONICLE_KEY_PATH="$RUN_DIR/secrets/chronicle.key" \
          npm start >"$RUN_DIR/server.log" 2>&1 &
          for i in {1..20}; do
            curl -sf http://127.0.0.1:3000/v1/health >/dev/null && exit 0
            sleep 0.5
          done
          cat "$RUN_DIR/server.log"
          exit 1
        env:
          NODE_ENV: development

      - name: Run load test smoke (2 clients, 5s)
        run: |
          cd tools/loadtest
          npm run loadtest -- run --scenario movement-heavy --clients 2 --duration 5s --seed 12345

      - name: Upload load test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest-smoke-results
          path: tools/loadtest/runs/
          retention-days: 7
