name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: API-first invariant guard
        run: ./scripts/ci_invariant_guard.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/server/package-lock.json

      - name: Verify protocol docs are in sync
        run: ./scripts/verify_protocol_sync.sh

      - name: Install dependencies
        run: cd apps/server && npm ci

      - name: TypeScript build
        run: cd apps/server && npm run build

      - name: Run MVP verification
        run: ./scripts/verify_mvp.sh
